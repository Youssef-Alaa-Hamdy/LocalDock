[package]
name = "localdock-desktop"
version = "1.0.0"
description = "LocalDock — Your Personal Local Cloud (Windows shell)"
authors = ["LocalDock"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "localdock_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "LocalDock"
path = "src/main.rs"
required-features = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop-only shell pieces: the tray, the bundled-server lifecycle and the
# native plugins. The Android companion is serverless — it only discovers
# hosts on the LAN, so none of these are compiled for mobile targets.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
