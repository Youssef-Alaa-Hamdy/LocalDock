<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <title>LocalDock</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M32 12v26M32 38l-9-9M32 38l9-9' stroke='%2399f6e4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M16 48h32' stroke='%2399f6e4' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <!-- TOP HEADER -->
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#0f766e" />
          <path d="M32 12v26M32 38l-9-9M32 38l9-9" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M16 48h32" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" />
        </svg>
        <div>
          <h1>LocalDock</h1>
          <p class="tagline" data-i="tagline"></p>
        </div>
      </div>
      <select id="lang" class="lang" aria-label="Language"></select>
    </header>

    <!-- VIEW: DISCOVER (default) -->
    <main id="view-discover" class="view active">
      <section id="notice" class="notice hidden"></section>

      <!-- Scan status row -->
      <section class="scan-row">
        <div>
          <h2 data-i="discoveryTitle"></h2>
          <p class="muted" id="scanHint" data-i="looking"></p>
        </div>
        <button id="rescan" class="btn ghost compact" type="button">
          <span class="spin" aria-hidden="true">↻</span><span data-i="rescan"></span>
        </button>
      </section>

      <!-- Radar animation (while scanning) -->
      <section id="radar" class="radar-wrap" aria-live="polite">
        <div class="radar">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
        </div>
        <p class="muted" data-i="lookingHint"></p>
      </section>

      <!-- Host list -->
      <section id="hosts" class="hosts hidden"></section>

      <!-- FAB: pair manually -->
      <div class="fab-row">
        <button id="openPair" class="btn primary wide fab-btn" type="button" data-i="pairCta"></button>
      </div>
    </main>

    <!-- VIEW: PAIR (step wizard) -->
    <main id="view-pair" class="view hidden">
      <!-- Step indicator -->
      <div class="stepper">
        <div class="step active" id="step-dot-1">
          <div class="step-dot"><span>1</span></div>
          <div class="step-label" data-i="stepServer"></div>
        </div>
        <div class="step-line"></div>
        <div class="step" id="step-dot-2">
          <div class="step-dot"><span>2</span></div>
          <div class="step-label" data-i="stepCode"></div>
        </div>
      </div>

      <!-- STEP 1: Choose server -->
      <section id="step1" class="card step-content">
        <div class="step-header">
          <button class="btn icon back-btn" id="backToDiscover" type="button">←</button>
          <h3 data-i="chooseServerTitle"></h3>
        </div>
        <p class="muted" data-i="chooseServerHint"></p>

        <!-- Discovered servers list -->
        <div id="pairServerList" class="server-list"></div>

        <!-- Manual entry toggle -->
        <button id="toggleManual" class="btn ghost wide manual-toggle" type="button">
          <span class="toggle-icon">＋</span> <span data-i="manualTitle"></span>
        </button>

        <div id="manualEntry" class="manual-entry hidden">
          <label class="lbl" for="manualHost" data-i="manualHint"></label>
          <input id="manualHost" class="field" placeholder="192.168.1.3:3000"
            inputmode="url" autocomplete="off" spellcheck="false" />
          <p id="manualError" class="error hidden"></p>
        </div>

        <button id="step1Next" class="btn primary wide" type="button" data-i="next"></button>
      </section>

      <!-- STEP 2: Enter code -->
      <section id="step2" class="card step-content hidden">
        <div class="step-header">
          <button class="btn icon back-btn" id="backToStep1" type="button">←</button>
          <h3 data-i="enterCodeTitle"></h3>
        </div>

        <!-- selected server preview -->
        <div class="selected-server" id="selectedServerPreview"></div>

        <p class="muted" data-i="pairHint"></p>

        <!-- Code input: 6 individual boxes -->
        <div class="code-boxes" id="codeBoxes">
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <span class="code-sep">-</span>
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
        </div>

        <p id="pairError" class="error hidden"></p>
        <button id="pairGo" class="btn primary wide" type="button" data-i="pairGo"></button>
      </section>
    </main>

    <!-- VIEW: CONNECTING spinner -->
    <main id="view-connecting" class="view hidden view-center">
      <div class="connect-anim">
        <div class="connect-ring"></div>
        <svg class="logo-center" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#0f766e" />
          <path d="M32 12v26M32 38l-9-9M32 38l9-9" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M16 48h32" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" />
        </svg>
      </div>
      <h2 id="connectingTitle" data-i="connecting"></h2>
      <p class="muted" id="connectingHint" data-i="connectingHint"></p>
      <button id="cancelConnect" class="btn ghost" type="button" data-i="cancel"></button>
    </main>

    <footer>
      <p data-i="footerHint"></p>
      <p class="muted small"><span data-i="footerCompanion"></span> · <span id="ver">1.0.0</span></p>
    </footer>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
