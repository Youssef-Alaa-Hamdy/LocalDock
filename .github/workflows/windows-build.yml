name: Windows Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + unit tests
        run: |
          bun run lint
          bun test tests/unit/paths.test.ts

      # Web smoke tests are skipped in CI (they need a live dev server on a
      # Linux runner). The Windows bundle is validated by the build itself.

      - name: Build web app + Tauri bundle
        run: bun run build:windows
        env:
          # Prep downloads the official node.exe into src-tauri/resources/bin
          LOCALDOCK_NODE_VERSION: "22.14.0"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          Compress-Archive -Path "$rel/LocalDock.exe","$rel/resources" -DestinationPath "$rel/LocalDock-portable.zip" -Force
          Get-ChildItem "$rel/bundle/nsis" | Select-Object Name,Length

      - name: Upload installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: LocalDock-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LocalDock-Windows-portable
          path: src-tauri/target/release/LocalDock-portable.zip
          if-no-files-found: error
