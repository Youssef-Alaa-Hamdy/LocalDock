name: Windows Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + unit tests
        run: |
          bun run lint
          bun test tests/unit/paths.test.ts

      - name: Build web app + Tauri bundle
        run: bun run build:windows
        env:
          LOCALDOCK_NODE_VERSION: "22.14.0"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          Compress-Archive -Path "$rel/LocalDock.exe","$rel/resources" -DestinationPath "$rel/LocalDock-portable.zip" -Force
          Get-ChildItem "$rel/bundle/nsis" | Select-Object Name,Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalDock-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalDock-Windows-portable
          path: src-tauri/target/release/LocalDock-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/LocalDock-portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
